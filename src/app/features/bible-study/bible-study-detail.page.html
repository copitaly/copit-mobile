<ion-page>
  <ion-content fullscreen class="feature-page-content bible-study-detail-content">
    <app-feature-page-shell
      title="Bible Study"
      subtitle="Read published manual details."
      backFallbackRoute="/bible-study"
    >
        <div *ngIf="loading" class="skeleton-stack" aria-live="polite" data-testid="loading-state">
          <div class="detail-card skeleton">
            <div class="detail-card__body">
              <div class="detail-card__cover-skeleton"></div>
              <div class="detail-card__copy">
                <span class="skeleton-line skeleton-line--title"></span>
                <span class="skeleton-line skeleton-line--meta"></span>
                <span class="skeleton-line skeleton-line--meta short"></span>
                <span class="skeleton-line skeleton-line--meta shorter"></span>
              </div>
            </div>
          </div>

          <div class="detail-card skeleton detail-card--secondary" *ngFor="let item of skeletonItems">
            <span class="skeleton-line skeleton-line--secondary"></span>
          </div>
        </div>

        <div *ngIf="!loading && notFound" class="state-card empty-state" data-testid="not-found-state">
          <div class="state-copy">
            <h2>Manual not found</h2>
            <p>This Bible Study manual is no longer available or may not be published.</p>
          </div>
          <ion-button expand="block" class="state-button" routerLink="/bible-study">
            Back to Bible Study
          </ion-button>
        </div>

        <div *ngIf="!loading && !notFound && errorMessage" class="state-card error-state" data-testid="error-state">
          <div class="state-copy">
            <h2>We couldn't load this manual</h2>
            <p>{{ errorMessage }}</p>
          </div>
          <ion-button expand="block" class="state-button" (click)="retryLoad()">Try Again</ion-button>
        </div>

        <button
          *ngIf="!loading && !notFound && !errorMessage && manual"
          type="button"
          class="detail-card detail-card--interactive ion-activatable"
          data-testid="manual-detail"
          [disabled]="!manual.pdf_url || openingReader || downloadingPdf"
          [attr.aria-label]="buildReaderAriaLabel(manual)"
          (click)="openReader()"
        >
          <div class="detail-card__body">
            <div class="detail-card__cover" [class.detail-card__cover--placeholder]="!manual.cover_image_url">
              <img *ngIf="manual.cover_image_url; else coverPlaceholder" [src]="manual.cover_image_url" [alt]="manual.title + ' cover'" />
              <ng-template #coverPlaceholder>
                <ion-icon name="book-outline" aria-hidden="true"></ion-icon>
              </ng-template>
            </div>

            <div class="detail-card__copy">
              <h2>{{ manual.title }}</h2>
              <p class="detail-card__meta">{{ manual.year }} / {{ manual.language_display }}</p>
              <p *ngIf="formatVolume(manual.volume)" class="detail-card__detail">{{ formatVolume(manual.volume) }}</p>
              <p class="detail-card__detail">{{ formatWeekRange(manual) }}</p>
            </div>
          </div>
          <ion-ripple-effect></ion-ripple-effect>
        </button>

        <section *ngIf="!loading && !notFound && !errorMessage && manual" class="action-card" data-testid="manual-actions">
          <div class="action-card__buttons">
            <ion-button
              expand="block"
              class="state-button action-card__button action-card__button--primary"
              [disabled]="!manual.pdf_url || openingReader || downloadingPdf"
              data-testid="open-pdf-button"
              aria-label="Read this manual in the app"
              (click)="openReader()"
            >
              <ion-spinner *ngIf="openingReader" slot="start" name="crescent"></ion-spinner>
              <ion-icon *ngIf="!openingReader" slot="start" name="reader-outline" aria-hidden="true"></ion-icon>
              <span>{{ openingReader ? 'Opening reader...' : 'Read in App' }}</span>
            </ion-button>

            <ion-button
              expand="block"
              fill="outline"
              class="action-card__button action-card__button--secondary"
              [disabled]="!manual.pdf_url || openingReader || downloadingPdf"
              data-testid="download-pdf-button"
              aria-label="Download this manual as a PDF"
              (click)="downloadPdf()"
            >
              <ion-spinner *ngIf="downloadingPdf" slot="start" name="crescent"></ion-spinner>
              <ion-icon *ngIf="!downloadingPdf" slot="start" name="download-outline" aria-hidden="true"></ion-icon>
              <span>{{ downloadingPdf ? 'Downloading...' : 'Download PDF' }}</span>
            </ion-button>
          </div>
        </section>
    </app-feature-page-shell>
  </ion-content>
</ion-page>
