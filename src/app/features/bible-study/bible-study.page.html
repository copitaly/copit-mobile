<ion-page>
  <ion-content fullscreen class="bible-study-content">
    <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <div class="bible-study-shell">
      <header class="bible-study-header">
        <app-mobile-header
          title="Bible Study"
          subtitle="Grow in faith through God's Word"
          [showBack]="false"
          fallbackRoute="/tabs/home"
        ></app-mobile-header>
      </header>

      <div *ngIf="loading" class="bible-study-stack" aria-live="polite">
        <section class="bible-study-section">
          <app-mobile-section-header title="Featured Bible Study" subtitle="Start with the newest published manual available to read now."></app-mobile-section-header>
          <div class="hero-skeleton">
            <div class="hero-skeleton__media"></div>
            <div class="hero-skeleton__body">
              <span class="skeleton-line skeleton-line--hero-kicker"></span>
              <span class="skeleton-line skeleton-line--hero-title"></span>
              <span class="skeleton-line skeleton-line--hero-meta"></span>
              <span class="skeleton-line skeleton-line--hero-detail"></span>
              <span class="skeleton-line skeleton-line--hero-cta"></span>
            </div>
          </div>
        </section>

        <section class="bible-study-section">
          <app-mobile-section-header title="Available Manuals" subtitle="Choose a manual to read or download."></app-mobile-section-header>
          <div class="manual-list manual-list--skeleton">
            <div *ngFor="let item of skeletonItems" class="manual-list__item">
              <div class="row-skeleton">
                <div class="row-skeleton__thumb"></div>
                <div class="row-skeleton__copy">
                  <span class="skeleton-line skeleton-line--row-title"></span>
                  <span class="skeleton-line skeleton-line--row-meta"></span>
                  <span class="skeleton-line skeleton-line--row-detail"></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div *ngIf="!loading && errorMessage" class="state-card error-state" data-testid="error-state">
        <div class="state-copy">
          <h2>We couldn't load Bible Study manuals right now.</h2>
          <p>{{ errorMessage }}</p>
        </div>
        <ion-button expand="block" class="state-button" (click)="retryLoad()">Try Again</ion-button>
      </div>

      <div *ngIf="!loading && !errorMessage && manuals.length === 0" class="state-card empty-state" data-testid="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <ion-icon name="book-outline"></ion-icon>
        </div>
        <div class="state-copy">
          <h2>No Bible Studies Available</h2>
          <p>New manuals will appear here when published.</p>
        </div>
      </div>

      <div *ngIf="!loading && !errorMessage && manuals.length > 0" class="bible-study-stack">
        <section class="bible-study-section">
          <app-mobile-section-header
            [title]="heroSectionTitle"
            [subtitle]="heroSectionSubtitle"
          ></app-mobile-section-header>

          <app-mobile-hero-card
            *ngIf="heroManual"
            data-testid="hero-card"
            [title]="heroTitle"
            [meta]="heroMeta"
            [detail]="heroDetail"
            [ctaLabel]="heroCtaLabel"
            [imageSrc]="heroManual.cover_image_url"
            [imageAlt]="heroTitle + ' cover'"
            [ariaLabel]="heroAriaLabel"
            [progressPercent]="heroProgressPercent"
            [progressLabel]="heroProgressLabel"
            [progressAriaLabel]="heroProgressLabel"
            (cardClick)="openHero()"
          ></app-mobile-hero-card>
        </section>

        <section class="bible-study-section" aria-label="Bible Study manuals">
          <app-mobile-section-header
            title="Available Manuals"
            subtitle="Choose a manual to read or download."
          ></app-mobile-section-header>

          <div class="manual-list">
            <div *ngFor="let manual of manuals; trackBy: trackByManualId" class="manual-list__item" data-testid="manual-card">
              <app-mobile-content-row
                [title]="manual.title"
                [meta]="buildManualMeta(manual)"
                [detail]="buildManualDetail(manual)"
                [thumbnailSrc]="manual.cover_image_url"
                [thumbnailAlt]="manual.title + ' cover'"
                [ariaLabel]="'Open Bible Study manual ' + manual.title"
                (rowClick)="openManual(manual)"
              ></app-mobile-content-row>
            </div>
          </div>
        </section>

        <div *ngIf="loadMoreErrorMessage" class="refresh-banner" data-testid="refresh-error-state" aria-live="polite">
          {{ loadMoreErrorMessage }}
        </div>
      </div>
    </div>
  </ion-content>
</ion-page>
