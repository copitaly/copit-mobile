<ion-page class="splash-page">
  <ion-content fullscreen class="splash-content" [attr.aria-label]="'splash.ariaLabel' | t">
    <div class="splash-inner">
      <div class="splash-stack">
        <div class="logo-wrap">
          <img src="assets/img/logo.png" [attr.alt]="'splash.logoAlt' | t" />
        </div>
        <div class="text-block" [class.text-block--visible]="showSupportingCopy">
          <h1>{{ title }}</h1>
          <p
            class="tagline"
            [attr.aria-label]="('splash.taglineLineOne' | t) + ', ' + ('splash.taglineLineTwo' | t)"
          >
            <span>{{ 'splash.taglineLineOne' | t }}</span>
            <span>{{ 'splash.taglineLineTwo' | t }}</span>
          </p>
        </div>
      </div>

      <div
        *ngIf="showLoadingIndicator"
        class="loading-indicator"
        [class.loading-indicator--visible]="showSupportingCopy"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </ion-content>
</ion-page>
