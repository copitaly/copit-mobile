<ion-page>
  <ion-content fullscreen class="outcome-content cop-page cop-page--warm cop-content--secondary">
    <div class="outcome-shell">
      <app-mobile-header
        class="outcome-header"
        title="Donation status"
        subtitle="Review your donation outcome."
        fallbackRoute="/tabs/donate"
        tone="editorial"
      ></app-mobile-header>

      <div class="outcome-main outcome-main--cancelled">
        <section class="outcome-status" aria-live="polite" role="status">
          <span class="outcome-status__icon outcome-status__icon--cancelled" aria-hidden="true">
            <ion-icon name="close-outline"></ion-icon>
          </span>
          <h1 class="outcome-status__title">Payment cancelled</h1>
          <p class="outcome-status__subtitle">No payment was taken.</p>
        </section>

        <section class="outcome-card outcome-card--message cop-card cop-card--soft">
          <h2 class="outcome-card__title">Your donation was not completed.</h2>
          <p class="outcome-card__body">You can try again whenever you are ready.</p>
          <p class="outcome-card__body">Your card or account has not been charged.</p>
        </section>

        <div class="outcome-actions">
          <ion-button expand="block" class="outcome-button--primary" (click)="goToBranches()">Try again</ion-button>
          <ion-button expand="block" fill="outline" class="outcome-button--secondary" (click)="goHome()">
            Back to Home
          </ion-button>
        </div>
      </div>
    </div>
  </ion-content>
</ion-page>
