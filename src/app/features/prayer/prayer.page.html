<ion-page>
  <ion-content fullscreen class="prayer-content cop-content--secondary">
    <div class="prayer-shell cop-secondary-shell">
      <header class="prayer-header" [attr.aria-label]="'prayer.title' | t">
        <app-mobile-header
          [title]="'prayer.title' | t"
          [subtitle]="'prayer.subtitle' | t"
          fallbackRoute="/tabs/home"
          tone="editorial"
        ></app-mobile-header>
      </header>

      <section class="prayer-actions" [attr.aria-label]="'prayer.actionsLabel' | t">
        <button
          *ngFor="let action of primaryActions"
          type="button"
          class="prayer-action-card"
          [attr.aria-label]="action.titleKey | t"
          (click)="openAction(action.route)"
        >
          <span class="prayer-action-card__icon" aria-hidden="true">
            <ion-icon [name]="action.icon"></ion-icon>
          </span>
          <span class="prayer-action-card__copy">
            <strong>{{ action.titleKey | t }}</strong>
            <small>{{ action.descriptionKey | t }}</small>
          </span>
          <ion-icon class="prayer-action-card__chevron" name="chevron-forward" aria-hidden="true"></ion-icon>
        </button>

        <button
          *ngIf="showMemberAction"
          type="button"
          class="prayer-action-card"
          [attr.aria-label]="memberAction.titleKey | t"
          (click)="openAction(memberAction.route)"
        >
          <span class="prayer-action-card__icon" aria-hidden="true">
            <ion-icon [name]="memberAction.icon"></ion-icon>
          </span>
          <span class="prayer-action-card__copy">
            <strong>{{ memberAction.titleKey | t }}</strong>
            <small>{{ memberAction.descriptionKey | t }}</small>
          </span>
          <ion-icon class="prayer-action-card__chevron" name="chevron-forward" aria-hidden="true"></ion-icon>
        </button>
      </section>
    </div>
  </ion-content>
</ion-page>
