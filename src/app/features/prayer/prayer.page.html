<ion-page>
  <ion-content fullscreen class="prayer-content cop-content--secondary">
    <div class="prayer-shell cop-secondary-shell">
      <header class="prayer-header" [attr.aria-label]="'prayer.title' | t">
        <p class="prayer-header__eyebrow cop-page-header__eyebrow">{{ 'prayer.title' | t }}</p>
        <app-mobile-header
          [showBack]="false"
          [title]="'prayer.title' | t"
          [subtitle]="'prayer.subtitle' | t"
          fallbackRoute="/tabs/home"
          tone="editorial"
        ></app-mobile-header>
      </header>

      <section class="prayer-feature" [attr.aria-label]="primaryActions[0].titleKey | t">
        <div class="prayer-feature__art" aria-hidden="true">
          <span class="prayer-feature__halo"></span>
          <span class="prayer-feature__icon">
            <ion-icon [name]="primaryActions[0].icon"></ion-icon>
          </span>
        </div>
        <div class="prayer-feature__copy">
          <p class="prayer-feature__eyebrow">{{ 'prayer.title' | t }}</p>
          <h2>{{ primaryActions[0].titleKey | t }}</h2>
          <p>{{ primaryActions[0].descriptionKey | t }}</p>
        </div>
        <button
          type="button"
          class="prayer-feature__action"
          [attr.aria-label]="primaryActions[0].titleKey | t"
          (click)="openAction(primaryActions[0].route)"
        >
          <span>{{ 'prayer.sharePrayerRequest' | t }}</span>
          <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
        </button>
      </section>

      <section class="prayer-actions" [attr.aria-label]="'prayer.actionsLabel' | t">
        <div class="prayer-actions__eyebrow">{{ 'prayer.communityActionTitle' | t }}</div>

        <button
          *ngFor="let action of primaryActions.slice(1)"
          type="button"
          class="prayer-action-card"
          [attr.aria-label]="action.titleKey | t"
          (click)="openAction(action.route)"
        >
          <span class="prayer-action-card__icon" aria-hidden="true">
            <ion-icon [name]="action.icon"></ion-icon>
          </span>
          <span class="prayer-action-card__copy">
            <strong>{{ action.titleKey | t }}</strong>
            <small>{{ action.descriptionKey | t }}</small>
          </span>
          <ion-icon class="prayer-action-card__chevron" name="chevron-forward" aria-hidden="true"></ion-icon>
        </button>

        <button
          *ngIf="showMemberAction"
          type="button"
          class="prayer-action-card"
          [attr.aria-label]="memberAction.titleKey | t"
          (click)="openAction(memberAction.route)"
        >
          <span class="prayer-action-card__icon" aria-hidden="true">
            <ion-icon [name]="memberAction.icon"></ion-icon>
          </span>
          <span class="prayer-action-card__copy">
            <strong>{{ memberAction.titleKey | t }}</strong>
            <small>{{ memberAction.descriptionKey | t }}</small>
          </span>
          <ion-icon class="prayer-action-card__chevron" name="chevron-forward" aria-hidden="true"></ion-icon>
        </button>
      </section>
    </div>
  </ion-content>
</ion-page>
